# Fixture: a workflow that uploads an artifact. The audit must reject it.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check
        run: ./scripts/check.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
