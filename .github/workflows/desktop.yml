name: Desktop

on:
  # Every pull request runs both desktop jobs, whatever it touches.
  #
  # They are **required** status checks on `main`, and a path filter made that a
  # trap: a PR that changed only a workflow or a doc reported neither check, so
  # the merge button stayed blocked until someone touched `src/`. The jobs are a
  # few minutes; the alternative is a bypassed branch rule.
  pull_request:
  push:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - "src/**"
      - "scripts/desktop-*"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: desktop (linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Core dependencies
        run: bun install --frozen-lockfile

      - name: Dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Format check
        working-directory: desktop
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: desktop
        run: flutter analyze

      - name: Widget tests
        working-directory: desktop
        run: flutter test

      - name: Release build with the core sidecar
        run: ./scripts/desktop-build.sh linux

      - name: Install headless display tools
        run: sudo apt-get install -y xvfb xdotool imagemagick dbus

      - name: Startup budget
        run: ./scripts/desktop-perf.sh --runs=3 --host-factor=1.9

      - name: Package the Linux tarball
        run: |
          ./scripts/desktop-package.sh --no-build
          ls -lh dist/lockedin-desktop-linux-x64.tar.gz

      - name: Verify the bundled core is executable
        run: test -x desktop/build/linux/x64/release/bundle/lockedin-core

      - name: Install and uninstall with the user installer
        run: |
          prefix="$RUNNER_TEMP/lockedin-prefix"
          ./scripts/desktop-install.sh --prefix "$prefix"
          test -x "$prefix/lib/lockedin-desktop/lockedin-core"
          test -L "$prefix/bin/lockedin-desktop"
          test -f "$prefix/share/applications/lockedin.desktop"
          grep -q '^Exec=' "$prefix/share/applications/lockedin.desktop"
          ./scripts/desktop-install.sh --prefix "$prefix" --uninstall
          test ! -e "$prefix/bin/lockedin-desktop"
          test ! -d "$prefix/lib/lockedin-desktop"
          test ! -e "$prefix/share/applications/lockedin.desktop"

  windows:
    name: desktop (windows x64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Core dependencies
        run: bun install --frozen-lockfile

      - name: Dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Analyze
        working-directory: desktop
        run: flutter analyze

      - name: Widget tests
        working-directory: desktop
        run: flutter test

      - name: Release build with the core sidecar
        shell: bash
        run: ./scripts/desktop-build.sh windows

      - name: Package the Windows zip
        shell: pwsh
        run: |
          ./scripts/desktop-package.ps1 -NoBuild
          $artifact = Get-Item dist/lockedin-desktop-windows-x64.zip
          Write-Host ("zip size: {0:N0} bytes ({1:N1} MiB)" -f $artifact.Length, ($artifact.Length / 1MB))

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path (Join-Path $nsis "makensis.exe"))) {
            choco install nsis --no-progress -y
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Build and verify the unsigned installer
        shell: pwsh
        run: |
          ./scripts/desktop-installer.ps1 -Verify
          $setup = Get-Item dist/lockedin-desktop-windows-x64-setup.exe
          Write-Host ("setup size: {0:N0} bytes ({1:N1} MiB)" -f $setup.Length, ($setup.Length / 1MB))
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash | ForEach-Object { Write-Host "setup sha256: $_" }
